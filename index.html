<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Preview</title>
  <link rel="stylesheet" href="css/invitation.css">
  <style>
    :root {
      --primary-pink: #e60087;
      --accent-pink: #ff4f9a;
      --paper: #ffffff;
      --ink: #111111;
    }
    /* WELCOME & DETAILS SECTIONS ARE SLEEK BLACK (#111111) */
    .invitation-section.theme-navy { background-color: #111111 !important; color: #ffffff !important; }
    .invitation-section.theme-navy .invitation-side-notch-left,
    .invitation-section.theme-navy .invitation-side-notch-right { background-color: #EAE5D9 !important; }
    .invitation-perforated-divider { border-top-color: rgba(255,255,255,0.25); }
    .invitation-section.perforated-top-cream::before,
    .invitation-section.perforated-bottom-cream::after { background-image: radial-gradient(circle, transparent 6px, var(--paper) 7px); }
    .invitation-section.perforated-top-navy::before,
    .invitation-section.perforated-bottom-navy::after { background-image: radial-gradient(circle, transparent 6px, #111111 7px) !important; }
    
    /* DETAILS HEADER ALIGNMENT & CENTERING */
    .invitation-section.invitation-details-header-section {
      padding: 22px 16px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .invitation-details-header-section .invitation-details-title {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1 !important;
      color: #ffffff !important;
    }

    .highlight-circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-pink);
      margin: 2px auto;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Ticket Invitation">
    <div id="ticket-mount"></div>
  </main>
  <script src="js/invitationData.js"></script>
  <script src="js/invitationRenderer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/highEndRenderer.js"></script>
</body>
</html>
